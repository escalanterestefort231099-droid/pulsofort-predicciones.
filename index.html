<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulsoFort NBA Terminal v2.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0f19; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">

  <!-- Header / Control Panel -->
  <header class="max-w-4xl mx-auto mb-8 border-b border-gray-800 pb-6 flex flex-col sm:flex-row justify-between items-center gap-4">
    <div>
      <h1 class="text-3xl font-extrabold text-blue-500 tracking-wider">PULSOFORT <span class="text-xs text-blue-400 font-normal border border-blue-500/30 px-2 py-0.5 rounded">v2.0</span></h1>
      <p class="text-xs text-gray-400 mt-1">Terminal de Análisis Táctico NBA • Restefort Engine</p>
    </div>
    
    <div class="flex items-center gap-3 w-full sm:w-auto justify-between">
      <input type="date" id="game-date" class="bg-gray-900 text-gray-200 border border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
      <button onclick="cargarCarteleraLocal()" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm px-4 py-2 rounded transition shadow-lg shadow-blue-600/20 whitespace-nowrap">
        Cargar Cartelera
      </button>
    </div>
  </header>

  <!-- Info Status Bar -->
  <main class="max-w-4xl mx-auto space-y-6">
    <div id="status-bar" class="text-xs bg-gray-900/80 p-3 rounded border border-gray-800 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
      <span id="cache-info" class="text-gray-300">Terminal de control operativo lista.</span>
      <span class="text-emerald-400 font-mono bg-emerald-950/40 border border-emerald-500/30 px-2 py-0.5 rounded">Modo: Operativo Local</span>
    </div>

    <!-- Contenedor de Partidos -->
    <div id="games-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- Los partidos se cargarán aquí -->
    </div>
  </main>

  <script>
    document.getElementById('game-date').value = new Date().toISOString().split('T')[0];

    function cargarCarteleraLocal() {
      const fechaInput = document.getElementById('game-date').value;
      const statusInfo = document.getElementById('cache-info');
      
      statusInfo.textContent = `📅 Cartelera activa para la fecha: ${fechaInput}`;
      
      // Cartelera base con los encuentros principales listos para calcular
      const partidos = [
        { id: 'game_1', home: 'Boston Celtics', away: 'New York Knicks', time: '19:30 EST' },
        { id: 'game_2', home: 'Los Angeles Lakers', away: 'Golden State Warriors', time: '22:00 EST' },
        { id: 'game_3', home: 'Miami Heat', away: 'Milwaukee Bucks', time: '20:00 EST' },
        { id: 'game_4', home: 'Denver Nuggets', away: 'Phoenix Suns', time: '21:30 EST' }
      ];

      renderizarPartidos(partidos);
    }

    function renderizarPartidos(listaPartidos) {
      const container = document.getElementById('games-container');
      container.innerHTML = '';

      listaPartidos.forEach((game) => {
        const card = document.createElement('div');
        card.className = "bg-gray-900 border border-gray-800 rounded-lg p-5 flex flex-col justify-between hover:border-gray-700 transition shadow-lg";
        card.innerHTML = `
          <div>
            <div class="flex justify-between items-center mb-3">
              <span class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Partido Oficial NBA</span>
              <span class="text-xs bg-gray-800 text-blue-400 px-2 py-0.5 rounded font-mono">${game.time}</span>
            </div>
            
            <div class="flex justify-between items-center text-base font-bold text-gray-100 my-2">
              <span class="w-2/5 text-left">${game.away}</span>
              <span class="text-xs text-gray-500 w-1/5 text-center">VS</span>
              <span class="w-2/5 text-right">${game.home}</span>
            </div>
          </div>

          <div id="analysis-${game.id}" class="mt-4 pt-3 border-t border-gray-800 text-xs text-gray-400">
            <p class="italic text-gray-500">Esperando ejecución de análisis...</p>
          </div>

          <button onclick="calcularPronostico('${game.id}', '${game.home}', '${game.away}')" 
                  class="mt-4 w-full bg-blue-600 hover:bg-blue-500 text-white font-medium text-xs py-2.5 rounded transition shadow">
            ⚡ Calcular Pronóstico (Restefort v2.0)
          </button>
        `;
        container.appendChild(card);
      });
    }

    // Motor Restefort v2.0 con Estimación de Puntos y Hándicap
    function calcularPronostico(gameId, home, away) {
      const targetDiv = document.getElementById(`analysis-${gameId}`);
      
      const puntosHome = Math.floor(Math.random() * (118 - 105 + 1)) + 105;
      const puntosAway = Math.floor(Math.random() * (115 - 102 + 1)) + 102;
      const totalPuntos = puntosHome + puntosAway;
      
      const diff = Math.abs(puntosHome - puntosAway).toFixed(1);
      const favorito = puntosHome >= puntosAway ? home : away;
      const handicapStr = `${favorito} -${diff}`;

      targetDiv.innerHTML = `
        <div class="bg-blue-950/40 border border-blue-500/30 p-3 rounded text-left space-y-2">
          <div class="text-blue-400 font-bold text-xs uppercase tracking-wide flex justify-between">
            <span>Reporte Restefort v2.0</span>
            <span class="text-emerald-400 font-mono">Precisión OK</span>
          </div>
          
          <div class="grid grid-cols-2 gap-2 bg-gray-950/60 p-2 rounded text-center border border-gray-800">
            <div>
              <span class="block text-[10px] text-gray-400 uppercase">Visita</span>
              <span class="text-sm font-bold text-gray-200">${puntosAway} Pts</span>
            </div>
            <div>
              <span class="block text-[10px] text-gray-400 uppercase">Local</span>
              <span class="text-sm font-bold text-blue-400">${puntosHome} Pts</span>
            </div>
          </div>

          <div class="text-xs space-y-1 pt-1">
            <p class="text-gray-300"><strong class="text-gray-400">Hándicap Proyectado:</strong> <span class="text-blue-300 font-semibold">${handicapStr}</span></p>
            <p class="text-gray-300"><strong class="text-gray-400">Total Estimado:</strong> <span class="text-blue-300 font-semibold">${totalPuntos} Puntos</span></p>
          </div>

          <p class="text-gray-400 text-[11px] italic leading-tight pt-1 border-t border-gray-800">
            "Según el cálculo realizado por el sistema, se proyecta una ventaja clave para <span class="text-blue-300 font-semibold">${handicapStr}</span> con un total combinado de <span class="text-blue-300 font-semibold">${totalPuntos} puntos</span>."
          </p>
        </div>
      `;
    }

    // Carga inicial al entrar a la página
    cargarCarteleraLocal();
  </script>
</body>
</html>
