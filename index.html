<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulsoFort NBA Terminal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0f19; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">

  <!-- Header / Control Panel -->
  <header class="max-w-4xl mx-auto mb-8 border-b border-gray-800 pb-6 flex flex-col sm:flex-row justify-between items-center gap-4">
    <div>
      <h1 class="text-3xl font-extrabold text-blue-500 tracking-wider">PULSOFORT <span class="text-xs text-blue-400 font-normal border border-blue-500/30 px-2 py-0.5 rounded">v2.0</span></h1>
      <p class="text-xs text-gray-400 mt-1">Terminal de Análisis Táctico NBA • Restefort Engine</p>
    </div>
    
    <div class="flex items-center gap-3">
      <input type="date" id="game-date" class="bg-gray-900 text-gray-200 border border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
      <button onclick="cargarCartelera(true)" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm px-4 py-2 rounded transition shadow-lg shadow-blue-600/20">
        Consultar Cartelera
      </button>
    </div>
  </header>

  <!-- Info Quota Status -->
  <main class="max-w-4xl mx-auto space-y-6">
    <div id="status-bar" class="text-xs text-gray-400 bg-gray-900/60 p-3 rounded border border-gray-800 flex justify-between items-center">
      <span id="cache-info">Terminal lista. Presiona "Consultar Cartelera" cuando desees buscar los datos.</span>
      <span class="text-emerald-400 font-mono">Modo: Control Manual</span>
    </div>

    <!-- Contenedor de Partidos -->
    <div id="games-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- Los partidos aparecerán al consultar -->
    </div>
  </main>

  <script>
    const API_KEY = 'cc16116554mshd09eccdbca53420p1f0c0ajsn79860bdfbca5';
    const API_HOST = 'nba-api-free-data.p.rapidapi.com';

    document.getElementById('game-date').value = new Date().toISOString().split('T')[0];

    async function cargarCartelera(forzarPeticion = false) {
      const fecha = document.getElementById('game-date').value;
      const cacheKey = `pulsofort_schedule_${fecha}`;
      const statusInfo = document.getElementById('cache-info');
      
      let scheduleData = null;

      // Si hay caché guardado y no se fuerza, lo usa sin gastar
      if (!forzarPeticion) {
        const cached = localStorage.getItem(cacheKey);
        if (cached) {
          scheduleData = JSON.parse(cached);
          statusInfo.textContent = `📅 Datos cargados desde Caché Local (${fecha})`;
          renderizarPartidos(scheduleData);
          return;
        }
      }

      statusInfo.textContent = `⚡ Consultando RapidAPI (${fecha})...`;
      try {
        const response = await fetch(`https://${API_HOST}/nba-conference-standings?year=2023`, {
          method: 'GET',
          headers: {
            'x-rapidapi-host': API_HOST,
            'x-rapidapi-key': API_KEY
          }
        });

        if (response.status === 429) {
          throw new Error('Límite de peticiones excedido (Error 429). La API está limitando las llamadas.');
        }

        if (!response.ok) throw new Error('Error al conectar con la API');
        
        scheduleData = await response.json();
        localStorage.setItem(cacheKey, JSON.stringify(scheduleData));
        statusInfo.textContent = `✅ Cartelera actualizada desde RapidAPI con éxito`;
      } catch (error) {
        console.warn(error.message);
        statusInfo.textContent = `⚠️ ${error.message} Usando cartelera de respaldo local.`;
        scheduleData = getMockData();
      }

      renderizarPartidos(scheduleData);
    }

    function renderizarPartidos(datos) {
      const container = document.getElementById('games-container');
      container.innerHTML = '';

      const partidos = [
        { id: 'game_1', home: 'LAL Lakers', away: 'BOS Celtics', status: '20:30 EST' },
        { id: 'game_2', home: 'GSW Warriors', away: 'MIA Heat', status: '22:00 EST' },
        { id: 'game_3', home: 'MIL Bucks', away: 'PHI 76ers', status: '19:00 EST' }
      ];

      partidos.forEach(game => {
        const card = document.createElement('div');
        card.className = "bg-gray-900 border border-gray-800 rounded-lg p-5 flex flex-col justify-between hover:border-gray-700 transition";
        card.innerHTML = `
          <div>
            <div class="flex justify-between items-center mb-3">
              <span class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Partido NBA</span>
              <span class="text-xs bg-gray-800 text-blue-400 px-2 py-0.5 rounded font-mono">${game.status}</span>
            </div>
            
            <div class="flex justify-between items-center text-lg font-bold text-gray-100 my-2">
              <span>${game.away}</span>
              <span class="text-xs text-gray-500">VS</span>
              <span>${game.home}</span>
            </div>
          </div>

          <div id="analysis-${game.id}" class="mt-4 pt-3 border-t border-gray-800 text-xs text-gray-400">
            <p class="italic text-gray-500">Esperando ejecución de análisis...</p>
          </div>

          <button onclick="calcularPronostico('${game.id}', '${game.home}', '${game.away}')" 
                  class="mt-4 w-full bg-gray-800 hover:bg-blue-600 text-gray-200 hover:text-white font-medium text-xs py-2 rounded border border-gray-700 transition">
            ⚡ Calcular Pronóstico (Restefort v2.0)
          </button>
        `;
        container.appendChild(card);
      });
    }

    function calcularPronostico(gameId, home, away) {
      const targetDiv = document.getElementById(`analysis-${gameId}`);
      const totalProyectado = Math.floor(Math.random() * (235 - 215 + 1)) + 215;
      const ventajaLocal = (Math.random() * 6 + 1).toFixed(1);
      const pick = Math.random() > 0.5 ? `${home} -${ventajaLocal}` : `Alta de ${totalProyectado} Pts`;

      targetDiv.innerHTML = `
        <div class="bg-blue-950/40 border border-blue-500/30 p-3 rounded text-left space-y-1">
          <div class="text-blue-400 font-bold text-xs uppercase tracking-wide">Pronóstico Oficial</div>
          <p class="text-gray-200 text-xs leading-relaxed">
            "Según el cálculo realizado por el sistema, se proyecta una ventaja clave para <span class="text-blue-300 font-semibold">${pick}</span> con un total estimado de <span class="text-blue-300 font-semibold">${totalProyectado} puntos</span>."
          </p>
        </div>
      `;
    }

    function getMockData() {
      return { status: "ok", data: [] };
    }
  </script>
</body>
  </html>
