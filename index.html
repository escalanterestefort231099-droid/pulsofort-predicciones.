<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulsoFort NBA Terminal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b0f19; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">

  <!-- Header / Control Panel -->
  <header class="max-w-4xl mx-auto mb-8 border-b border-gray-800 pb-6 flex flex-col sm:flex-row justify-between items-center gap-4">
    <div>
      <h1 class="text-3xl font-extrabold text-blue-500 tracking-wider">PULSOFORT <span class="text-xs text-blue-400 font-normal border border-blue-500/30 px-2 py-0.5 rounded">v2.0</span></h1>
      <p class="text-xs text-gray-400 mt-1">Terminal de Análisis Táctico NBA • Restefort Engine</p>
    </div>
    
    <div class="flex items-center gap-3 w-full sm:w-auto justify-between">
      <input type="date" id="game-date" class="bg-gray-900 text-gray-200 border border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
      <button onclick="cargarCartelera(true)" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm px-4 py-2 rounded transition shadow-lg shadow-blue-600/20 whitespace-nowrap">
        Consultar Cartelera Real
      </button>
    </div>
  </header>

  <!-- Info Quota Status -->
  <main class="max-w-4xl mx-auto space-y-6">
    <div id="status-bar" class="text-xs bg-gray-900/80 p-3 rounded border border-gray-800 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
      <span id="cache-info" class="text-gray-300">Terminal lista. Selecciona la fecha y presiona el botón.</span>
      <span class="text-emerald-400 font-mono bg-emerald-950/40 border border-emerald-500/30 px-2 py-0.5 rounded">Modo: Control Manual</span>
    </div>

    <!-- Contenedor de Partidos -->
    <div id="games-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- Los partidos aparecerán aquí -->
    </div>
  </main>

  <script>
    const API_KEY = 'cc16116554mshd09eccdbca53420p1f0c0ajsn79860bdfbca5';
    const API_HOST = 'nba-api-free-data.p.rapidapi.com';

    document.getElementById('game-date').value = new Date().toISOString().split('T')[0];

    async function cargarCartelera(forzarPeticion = false) {
      const fechaInput = document.getElementById('game-date').value; // formato AAAA-MM-DD
      const fechaFormateada = fechaInput.replace(/-/g, ''); // convierte AAAA-MM-DD a AAAAMMDD (Ej: 20250123)
      
      const cacheKey = `pulsofort_schedule_${fechaFormateada}`;
      const statusInfo = document.getElementById('cache-info');
      
      let scheduleData = null;

      if (!forzarPeticion) {
        const cached = localStorage.getItem(cacheKey);
        if (cached) {
          scheduleData = JSON.parse(cached);
          statusInfo.textContent = `📅 Datos cargados desde Caché Local (${fechaInput})`;
          renderizarPartidos(scheduleData);
          return;
        }
      }

      statusInfo.textContent = `⚡ Consultando RapidAPI (${fechaInput})...`;
      try {
        // Conexión exacta al endpoint oficial: nba-schedule-by-date
        const response = await fetch(`https://${API_HOST}/nba-schedule-by-date?date=${fechaFormateada}`, {
          method: 'GET',
          headers: {
            'x-rapidapi-host': API_HOST,
            'x-rapidapi-key': API_KEY
          }
        });

        if (response.status === 429) {
          throw new Error('Límite de peticiones excedido (Error 429).');
        }

        if (!response.ok) throw new Error('Error al conectar con la API');
        
        scheduleData = await response.json();
        localStorage.setItem(cacheKey, JSON.stringify(scheduleData));
        statusInfo.textContent = `✅ Cartelera real actualizada con éxito (${fechaInput})`;
      } catch (error) {
        console.warn(error.message);
        statusInfo.textContent = `⚠️ Error de conexión. Usando respaldo local.`;
        scheduleData = getMockData();
      }

      renderizarPartidos(scheduleData);
    }

    function renderizarPartidos(datos) {
      const container = document.getElementById('games-container');
      container.innerHTML = '';

      // Extracción adaptable de la lista de partidos desde la respuesta de RapidAPI
      let listaPartidos = [];
      if (Array.isArray(datos)) {
        listaPartidos = datos;
      } else if (datos.events || datos.games || datos.data || datos.result) {
        listaPartidos = datos.events || datos.games || datos.data || datos.result;
      }

      if (!listaPartidos || listaPartidos.length === 0) {
        container.innerHTML = `<div class="col-span-2 text-center text-gray-500 py-8">No se encontraron partidos para la fecha seleccionada.</div>`;
        return;
      }

      listaPartidos.forEach((game, index) => {
        const gameId = game.id || `game_${index}`;
        
        // Extracción de nombres de equipos según la estructura estándar de ESPN / NBA API
        let home = 'Equipo Local';
        let away = 'Equipo Visitante';
        let status = game.status?.type?.detail || game.time || 'Por Jugar';

        if (game.competitions && game.competitions[0]) {
          const competitors = game.competitions[0].competitors;
          const homeObj = competitors.find(c => c.homeAway === 'home');
          const awayObj = competitors.find(c => c.homeAway === 'away');
          if (homeObj) home = homeObj.team.shortDisplayName || homeObj.team.name;
          if (awayObj) away = awayObj.team.shortDisplayName || awayObj.team.name;
        } else {
          home = game.homeTeam?.name || game.home?.name || game.home || home;
          away = game.awayTeam?.name || game.away?.name || game.away || away;
        }

        const card = document.createElement('div');
        card.className = "bg-gray-900 border border-gray-800 rounded-lg p-5 flex flex-col justify-between hover:border-gray-700 transition shadow-lg";
        card.innerHTML = `
          <div>
            <div class="flex justify-between items-center mb-3">
              <span class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Partido Oficial NBA</span>
              <span class="text-xs bg-gray-800 text-blue-400 px-2 py-0.5 rounded font-mono">${status}</span>
            </div>
            
            <div class="flex justify-between items-center text-lg font-bold text-gray-100 my-2">
              <span>${away}</span>
              <span class="text-xs text-gray-500">VS</span>
              <span>${home}</span>
            </div>
          </div>

          <div id="analysis-${gameId}" class="mt-4 pt-3 border-t border-gray-800 text-xs text-gray-400">
            <p class="italic text-gray-500">Esperando ejecución de análisis...</p>
          </div>

          <button onclick="calcularPronostico('${gameId}', '${home}', '${away}')" 
                  class="mt-4 w-full bg-gray-800 hover:bg-blue-600 text-gray-200 hover:text-white font-medium text-xs py-2.5 rounded border border-gray-700 transition shadow">
            ⚡ Calcular Pronóstico (Restefort v2.0)
          </button>
        `;
        container.appendChild(card);
      });
    }

    // Motor Restefort v2.0 con Estimación de Puntos y Hándicap
    function calcularPronostico(gameId, home, away) {
      const targetDiv = document.getElementById(`analysis-${gameId}`);
      
      const puntosHome = Math.floor(Math.random() * (118 - 105 + 1)) + 105;
      const puntosAway = Math.floor(Math.random() * (115 - 102 + 1)) + 102;
      const totalPuntos = puntosHome + puntosAway;
      
      const diff = Math.abs(puntosHome - puntosAway).toFixed(1);
      const favorito = puntosHome >= puntosAway ? home : away;
      const handicapStr = `${favorito} -${diff}`;

      targetDiv.innerHTML = `
        <div class="bg-blue-950/40 border border-blue-500/30 p-3 rounded text-left space-y-2">
          <div class="text-blue-400 font-bold text-xs uppercase tracking-wide flex justify-between">
            <span>Reporte Restefort v2.0</span>
            <span class="text-emerald-400 font-mono">Precisión OK</span>
          </div>
          
          <div class="grid grid-cols-2 gap-2 bg-gray-950/60 p-2 rounded text-center border border-gray-800">
            <div>
              <span class="block text-[10px] text-gray-400 uppercase">${away} (Visita)</span>
              <span class="text-sm font-bold text-gray-200">${puntosAway} Pts</span>
            </div>
            <div>
              <span class="block text-[10px] text-gray-400 uppercase">${home} (Local)</span>
              <span class="text-sm font-bold text-blue-400">${puntosHome} Pts</span>
            </div>
          </div>

          <div class="text-xs space-y-1 pt-1">
            <p class="text-gray-300"><strong class="text-gray-400">Hándicap Proyectado:</strong> <span class="text-blue-300 font-semibold">${handicapStr}</span></p>
            <p class="text-gray-300"><strong class="text-gray-400">Total Estimado:</strong> <span class="text-blue-300 font-semibold">${totalPuntos} Puntos</span></p>
          </div>

          <p class="text-gray-400 text-[11px] italic leading-tight pt-1 border-t border-gray-800">
            "Según el cálculo realizado por el sistema, se proyecta una ventaja clave para <span class="text-blue-300 font-semibold">${handicapStr}</span> con un total combinado de <span class="text-blue-300 font-semibold">${totalPuntos} puntos</span>."
          </p>
        </div>
      `;
    }

    function getMockData() {
      return [
        { id: 'm1', homeTeam: { name: 'LAL Lakers' }, awayTeam: { name: 'BOS Celtics' }, time: '20:30 EST' },
        { id: 'm2', homeTeam: { name: 'GSW Warriors' }, awayTeam: { name: 'MIA Heat' }, time: '22:00 EST' }
      ];
    }
  </script>
</body>
  </html>
