<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulsoFort99 - Terminal Analítica NBA</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">

    <!-- Header / Navbar Público -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="text-2xl font-black tracking-wider text-emerald-400">PULSOFORT <span class="text-xs bg-emerald-500/20 text-emerald-300 py-1 px-2 rounded-full border border-emerald-500/30">v2.0 EVO</span></span>
            </div>
            <div class="flex items-center space-x-4">
                <span class="text-xs text-slate-400 flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> En Línea
                </span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Cartelera Analítica -->
        <section class="lg:col-span-3 space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold text-slate-200 flex items-center gap-2">
                    🏀 Cartelera NBA <span class="text-xs font-normal text-slate-400">(Motor Restefort v2.0 Activo)</span>
                </h2>
                <span class="text-xs bg-slate-800 text-slate-300 py-1 px-3 rounded-full border border-slate-700">
                    Temporada Regular
                </span>
            </div>

            <div id="games-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Se inyectará la cartelera de forma dinámica -->
            </div>
        </section>

    </main>

    <script>
        // ==========================================
        // MOTOR RESTEFORT v2.0 - CARGA Y CÁLCULO
        // ==========================================
        function cargarCarteleraNBA() {
            const partidosDelDia = [
                {
                    id: 1,
                    arena: "Crypto.com Arena",
                    equipoA: { nombre: "Los Angeles Lakers", ppg: 114.5, pace: 101.4, netRtg: 4.2, efg: 56.5, oreb: 28.5, tov: 13.2 },
                    equipoB: { nombre: "Dallas Mavericks", ppg: 110.2, pace: 98.2, netRtg: 1.5, efg: 54.0, oreb: 26.0, tov: 14.5 },
                    lineaOU: 228.5,
                    lineaSpread: -4.5,
                    faa: 0.5 
                },
                {
                    id: 2,
                    arena: "Wells Fargo Center",
                    equipoA: { nombre: "Philadelphia 76ers", ppg: 108.0, pace: 93.5, netRtg: 2.1, efg: 52.0, oreb: 27.0, tov: 12.8 },
                    equipoB: { nombre: "Boston Celtics", ppg: 116.2, pace: 100.1, netRtg: 6.8, efg: 58.0, oreb: 29.2, tov: 11.5 },
                    lineaOU: 218.0,
                    lineaSpread: +3.5,
                    faa: -1.0
                }
            ];

            let container = document.getElementById('games-container');
            container.innerHTML = '';

            partidosDelDia.forEach(partido => {
                let res = calcularRestefortv2(partido);

                let tarjeta = `
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-lg flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-center mb-3 border-b border-slate-800/60 pb-2">
                                <span class="text-xs font-semibold text-emerald-400 uppercase tracking-wider">Encuentro Programado</span>
                                <span class="text-xs text-slate-400">${partido.arena}</span>
                            </div>
                            
                            <div class="grid grid-cols-7 gap-2 items-center text-center my-3">
                                <div class="col-span-3 text-right pr-2">
                                    <h3 class="font-bold text-base text-slate-100">${partido.equipoA.nombre}</h3>
                                    <p class="text-xs text-slate-400">Pace: ${partido.equipoA.pace} | Net: +${partido.equipoA.netRtg}</p>
                                </div>
                                <div class="col-span-1 text-xs font-black text-slate-500">VS</div>
                                <div class="col-span-3 text-left pl-2">
                                    <h3 class="font-bold text-base text-slate-100">${partido.equipoB.nombre}</h3>
                                    <p class="text-xs text-slate-400">Pace: ${partido.equipoB.pace} | Net: +${partido.equipoB.netRtg}</p>
                                </div>
                            </div>
                        </div>

                        <div class="bg-slate-950 p-3 rounded-lg border border-emerald-500/20 space-y-2 mt-3">
                            <div class="flex justify-between text-xs text-slate-400 border-b border-slate-800/50 pb-1">
                                <span>Proyección Restefort v2.0</span>
                                <span class="text-emerald-400 font-bold">Línea O/U: ${partido.lineaOU}</span>
                            </div>
                            <div class="grid grid-cols-2 gap-2 text-xs">
                                <div>Total Proyectado: <strong class="text-emerald-400">${res.totalProyectado} Pts</strong></div>
                                <div>Margen Spread: <strong class="text-slate-200">${res.margenProyectado >= 0 ? '+' : ''}${res.margenProyectado}</strong></div>
                            </div>
                            <div class="pt-1 border-t border-slate-800/50 flex justify-between text-[11px]">
                                <span class="text-emerald-300"><strong>Total:</strong> ${res.recTotal}</span>
                                <span class="text-sky-300"><strong>Spread:</strong> ${res.recSpread}</span>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += tarjeta;
            });
        }

        function calcularRestefortv2(p) {
            // Paso 2: Normalización de Ritmo (Factor Pace)
            let paceCombinado = (p.equipoA.pace + p.equipoB.pace) / 2;
            let factorPace = paceCombinado / 100;
            let puntajeBaseProyectado = (p.equipoA.ppg + p.equipoB.ppg) * factorPace;

            // Paso 3: Matriz AAT (Diferenciales No-Redundantes)
            let deltaNetRTG = (p.equipoA.netRtg - p.equipoB.netRtg) * factorPace * 0.5;
            let deltaEFG = (p.equipoA.efg - p.equipoB.efg) * 100 * 0.25;
            let deltaPosesiones = ((p.equipoA.oreb - p.equipoB.oreb) * 0.35) + ((p.equipoB.tov - p.equipoA.tov) * 0.65);
            let aat = deltaNetRTG + deltaEFG + deltaPosesiones + p.faa;

            // Paso 4: Ecuaciones de Salida (Sin Inflación)
            let totalProyectado = puntajeBaseProyectado + Math.abs(aat);
            let margenProyectado = (p.equipoA.ppg - p.equipoB.ppg) + aat;

            // Paso 5: Reglas de Decisión (Valor EV+)
            let diferencialTotal = totalProyectado - p.lineaOU;
            let diferencialSpread = margenProyectado - p.lineaSpread;

            let recTotal = "Sin Apuesta";
            if (diferencialTotal >= 5.0) recTotal = "📈 ALTA (OVER)";
            if (diferencialTotal <= -5.0) recTotal = "📉 BAJA (UNDER)";

            let recSpread = "Sin Apuesta";
            if (diferencialSpread >= 3.5) recSpread = "Cubre Equipo A";
            if (diferencialSpread <= -3.5) recSpread = "Cubre Equipo B";

            return {
                totalProyectado: totalProyectado.toFixed(1),
                margenProyectado: margenProyectado.toFixed(1),
                recTotal,
                recSpread
            };
        }

        window.onload = cargarCarteleraNBA;
    </script>
</body>
</html>
