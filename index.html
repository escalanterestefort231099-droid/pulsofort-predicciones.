<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulsoFort99 - Terminal Analítica NBA</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">

    <!-- Header / Navbar Público -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="text-2xl font-black tracking-wider text-emerald-400">PULSOFORT <span class="text-xs bg-emerald-500/20 text-emerald-300 py-1 px-2 rounded-full border border-emerald-500/30">v2.0 EVO</span></span>
            </div>
            <div class="flex items-center space-x-4">
                <span class="text-xs text-slate-400 flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> En Línea
                </span>
                <!-- Botón de Iniciar Sesión exclusivo para ti -->
                <a href="admin.html" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold py-2 px-3 rounded-lg border border-slate-700 transition">
                    🔐 Iniciar Sesión
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Cartelera Estilo The Score -->
        <section class="lg:col-span-2 space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold text-slate-200 flex items-center gap-2">
                    🏀 Cartelera NBA <span class="text-xs font-normal text-slate-400">(Pre-juego y En Vivo)</span>
                </h2>
                <span class="text-xs bg-slate-800 text-slate-300 py-1 px-3 rounded-full border border-slate-700">
                    Temporada Regular
                </span>
            </div>

            <div id="games-container" class="space-y-4">
                <!-- Tarjeta de Partido -->
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-lg">
                    <div class="flex justify-between items-center mb-3 border-b border-slate-800/60 pb-2">
                        <span class="text-xs font-semibold text-emerald-400 uppercase tracking-wider">Próximo Encuentro</span>
                        <span class="text-xs text-slate-400">Crypto.com Arena</span>
                    </div>
                    
                    <div class="grid grid-cols-7 gap-2 items-center text-center my-3">
                        <div class="col-span-3 text-right pr-2">
                            <h3 class="font-bold text-base text-slate-100">Los Angeles Lakers</h3>
                            <p class="text-xs text-slate-400">Pace: 101.4</p>
                        </div>
                        <div class="col-span-1 text-xs font-black text-slate-500">VS</div>
                        <div class="col-span-3 text-left pl-2">
                            <h3 class="font-bold text-base text-slate-100">Dallas Mavericks</h3>
                            <p class="text-xs text-slate-400">Pace: 98.2</p>
                        </div>
                    </div>

                    <button onclick="verProyeccion()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold py-2.5 rounded-lg text-xs transition shadow-md">
                        ⚡ Ver Proyección Restefort v2.0
                    </button>
                </div>
            </div>
        </section>

        <!-- Columna de Resultados -->
        <section class="space-y-4">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 sticky top-20 shadow-xl">
                <h3 class="text-sm font-bold text-slate-300 uppercase tracking-wider mb-3">Terminal de Resultados</h3>
                <div id="result-display" class="space-y-4 text-sm text-slate-400">
                    <div class="p-6 text-center border border-dashed border-slate-800 rounded-xl bg-slate-950/40">
                        <p class="text-xs text-slate-500">Selecciona un partido para ver el análisis matemático en tiempo real.</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        function verProyeccion() {
            document.getElementById('result-display').innerHTML = `
                <div class="bg-slate-950 p-4 rounded-xl border border-emerald-500/30 space-y-3">
                    <div class="flex justify-between text-xs text-slate-400 border-b border-slate-800 pb-2">
                        <span>Análisis Automático</span>
                        <span class="text-emerald-400 font-bold">EV+ OK</span>
                    </div>
                    <div class="space-y-1 text-xs">
                        <div class="flex justify-between"><span>Total Proyectado:</span> <strong class="text-emerald-400">228.5 Pts</strong></div>
                        <div class="flex justify-between"><span>Spread Sugerido:</span> <strong class="text-slate-200">LAL -4.5</strong></div>
                    </div>
                </div>`;
        }
    </script>
</body>
</html>
